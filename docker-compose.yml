version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: character_tracker
      POSTGRES_USER: chartracker
      POSTGRES_PASSWORD: chartracker_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartracker -d character_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://chartracker:chartracker_pass@db:5432/character_tracker
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
